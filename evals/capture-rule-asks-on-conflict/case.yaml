{
  "schema_version": "1.1",
  "name": "capture-rule-asks-on-conflict",
  "description": "A new rule that contradicts a reference rule is shown beside it and nothing is written.",
  "tags": [
    "forge"
  ],
  "execution": {
    "prompt": "From now on, transfer types end in Dto, like PaymentDto.",
    "max_turns": 10,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "verdict",
      "focus": "last_message",
      "criteria": "The reply names the existing naming rule against the Dto suffix as a conflict, shows both rules, and asks the user to keep, replace, or merge. It does not say the rule was added."
    }
  ]
}
