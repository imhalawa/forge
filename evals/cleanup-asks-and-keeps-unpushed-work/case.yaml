{
  "schema_version": "1.1",
  "name": "cleanup-asks-and-keeps-unpushed-work",
  "description": "Clean up asks first, then keeps a worktree with unpushed work.",
  "tags": [
    "forge"
  ],
  "execution": {
    "prompt": "Use the forge:cleanup skill for PROJ-500.\n\nState file /Users/me/.claude/forge/PROJ-500.json: two PRs, both merged: wt-1 in /w/refunds (branch PROJ-500-retry-failed-refund) and wt-2 in /w/refund-page (branch PROJ-500-show-retry-status).\ngit -C /w/refunds/.worktrees/PROJ-500-retry-failed-refund status --porcelain: (empty); rev-list origin/branch..branch: 0.\ngit -C /w/refund-page/.worktrees/PROJ-500-show-retry-status status --porcelain: ' M src/Page.tsx'.\nShow what you would remove and keep, and ask before removing anything.\n\nShell, git, tracker, GitHub and state-file tools are not available in this session; their outputs are captured below. Treat them as the tool output and do not try to call those tools. If the question tool is not available, write the one question you would ask and its options instead.\nThe time now is 2026-11-10T09:00:00Z.\n",
    "max_turns": 12,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "asks-first",
      "focus": "last_message",
      "criteria": "PASS if forge removes nothing yet and asks one question before removing anything, with options such as 'Clean up' and 'Keep them'. FAIL if it says it removed something, or asks no question."
    },
    {
      "type": "llm",
      "name": "keeps-dirty",
      "focus": "last_message",
      "criteria": "PASS if what forge shows puts the refunds worktree (PROJ-500-retry-failed-refund) under what it removes and keeps the refund-page worktree (PROJ-500-show-retry-status, uncommitted src/Page.tsx), saying why it is kept. FAIL if it would remove the refund-page worktree or its branch."
    }
  ]
}
