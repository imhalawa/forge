{
  "schema_version": "1.1",
  "name": "forge-reads-review-state",
  "description": "Forge reads the real review state before it speaks of review or merge.",
  "tags": [
    "forge"
  ],
  "execution": {
    "prompt": "/forge PROJ-500\n\nstate file /Users/me/.claude/forge/PROJ-500.json:\n```json\n{\"plan\": {\"parent\": {\"key\": \"PROJ-500\", \"title\": \"Retry failed refunds\", \"type\": \"story\"}, \"trackerUrl\": \"https://example.atlassian.net\", \"done\": [{\"criterion\": \"Failed refunds are retried within an hour\", \"by\": \"forge\", \"source\": \"Datadog\", \"how\": \"monitor\"}], \"prs\": [{\"pr\": \"S1\\u00b71\", \"name\": \"Retry a failed refund\", \"subTask\": \"PROJ-501\", \"title\": \"Retry failed refunds\", \"repo\": \"/w/refunds\", \"base\": \"main\", \"criteria\": [\"x\"], \"rules\": [\"When a refund fails, it is retried once.\"], \"dependsOn\": []}]}, \"lanes\": [{\"id\": \"wt-1\", \"subTask\": \"PROJ-501\", \"pr\": \"S1\\u00b71\", \"repo\": \"/w/refunds\", \"branch\": \"PROJ-500-retry-failed-refund\", \"base\": \"main\", \"baseSha\": \"a1b2c3d\", \"worktree\": \"/w/refunds/.worktrees/PROJ-500-retry-failed-refund\", \"runner\": {\"kind\": \"session\", \"id\": \"local_1\"}, \"dependsOn\": [], \"state\": \"open\", \"prNumber\": 12, \"prUrl\": \"https://github.com/acme/refunds/pull/12\"}]}\n```\n\ngh pr view 12 --repo acme/refunds --json reviewDecision,reviews,latestReviews,reviewRequests,mergeStateStatus,commits:\n```json\n{\"reviewDecision\": \"APPROVED\", \"mergeStateStatus\": \"CLEAN\", \"reviewRequests\": [], \"commits\": [{\"oid\": \"1111111\", \"committedDate\": \"2026-11-10T14:43:00Z\"}, {\"oid\": \"2222222\", \"committedDate\": \"2026-11-10T14:52:00Z\"}], \"reviews\": [{\"author\": {\"login\": \"ines\"}, \"state\": \"DISMISSED\", \"commit\": {\"oid\": \"1111111\"}, \"submittedAt\": \"2026-11-10T14:47:00Z\"}, {\"author\": {\"login\": \"flavio\"}, \"state\": \"APPROVED\", \"commit\": {\"oid\": \"2222222\"}, \"submittedAt\": \"2026-11-10T14:53:00Z\"}]}\n```\ngh pr checks 12: all 4 checks passed.\ngh pr diff 12 --name-only: src/RetryJob.cs\n.github/CODEOWNERS on main: `/src/ @acme/payments-team` (flavio is in payments-team).\n\nShell, git, tracker, GitHub, session and state-file tools are not available in this session; their outputs are captured above. Treat them as the tool output and do not try to call those tools. If the question tool is not available, write the one question you would ask and its options instead.\nThe time now is 2026-11-10T15:00:00Z.\n",
    "max_turns": 12,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "real-state",
      "focus": "last_message",
      "criteria": "PASS if forge says the pull request is approved by flavio on the latest commit and is ready to merge (for example by asking to merge it), and does not say it still needs review or needs the repo owners. FAIL if it says it needs review or someone's approval."
    },
    {
      "type": "llm",
      "name": "names-dismissal",
      "focus": "last_message",
      "criteria": "PASS if forge says ines's earlier approval was dismissed by the later push, in any wording. FAIL if it does not mention it."
    }
  ]
}
