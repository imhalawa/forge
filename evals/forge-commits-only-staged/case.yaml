{
  "schema_version": "1.1",
  "name": "forge-commits-only-staged",
  "description": "With part of the change staged, forge asks to commit and open the PR, and commits only what is staged.",
  "tags": [
    "forge"
  ],
  "execution": {
    "prompt": "/forge PROJ-500\n\nstate file /Users/me/.claude/forge/PROJ-500.json:\n```json\n{\"plan\": {\"parent\": {\"key\": \"PROJ-500\", \"title\": \"Retry failed refunds\", \"type\": \"story\"}, \"trackerUrl\": \"https://example.atlassian.net\", \"done\": [{\"criterion\": \"Failed refunds are retried within an hour\", \"by\": \"forge\", \"source\": \"Datadog\", \"how\": \"monitor refund.retry.lag below 60 minutes\"}, {\"criterion\": \"The refund page shows the retry status\", \"by\": \"you\"}], \"prs\": [{\"pr\": \"S1\\u00b71\", \"name\": \"Retry a failed refund\", \"subTask\": \"PROJ-501\", \"title\": \"Retry failed refunds\", \"repo\": \"/w/refunds\", \"base\": \"main\", \"criteria\": [\"Given a failed refund, when the retry job runs, then it is retried once\"], \"dependsOn\": []}, {\"pr\": \"S2\\u00b71\", \"name\": \"Show the retry status\", \"subTask\": \"PROJ-502\", \"title\": \"Show retry status\", \"repo\": \"/w/refund-page\", \"base\": \"main\", \"criteria\": [\"Given a retried refund, when the page loads, then it shows Retrying\"], \"dependsOn\": []}]}, \"lanes\": [{\"id\": \"wt-1\", \"subTask\": \"PROJ-501\", \"pr\": \"S1\\u00b71\", \"repo\": \"/w/refunds\", \"branch\": \"PROJ-500-retry-failed-refund\", \"base\": \"main\", \"baseSha\": \"a1b2c3d\", \"worktree\": \"/w/refunds/.worktrees/PROJ-500-retry-failed-refund\", \"runner\": null, \"dependsOn\": [], \"state\": \"review\", \"prNumber\": null}]}\n```\ngit -C /w/refunds/.worktrees/PROJ-500-retry-failed-refund diff --cached --stat:\n```\n src/RetryJob.cs | 42 ++++++\n test/RetryJobTests.cs | 31 +++++\n```\ngit -C /w/refunds/.worktrees/PROJ-500-retry-failed-refund diff --stat:\n```\n src/Scratch.cs | 5 +++++\n```\nThe user answers the question with 'Open PR'. Then describe the git commands you run, in order, up to pushing.\n\nShell, git, tracker, GitHub and state-file tools are not available in this session; their outputs are captured below. Treat them as the tool output and do not try to call those tools. If the question tool is not available, write the one question you would ask and its options instead.\nThe time now is 2026-11-10T09:00:00Z.\n",
    "max_turns": 12,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "asks-commit-and-open",
      "focus": "last_message",
      "criteria": "PASS if forge's question is to commit the staged change and open a pull request (options like 'Open PR' and 'Later'). FAIL if it never asks, asks to review again, or lists the unstaged src/Scratch.cs as going into the pull request."
    },
    {
      "type": "llm",
      "name": "commits-staged-only",
      "focus": "last_message",
      "criteria": "PASS if the commit is a plain `git commit` of the staged changes (no `-a`, no `git add`), its subject starts with PROJ-500, and the rebase keeps the unstaged change (for example `--autostash`). FAIL if it stages or commits src/Scratch.cs, or uses `commit -a` or `git add -A`."
    }
  ]
}
