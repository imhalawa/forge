{
  "schema_version": "1.1",
  "name": "implement-leaves-change-unstaged",
  "description": "A forge build session builds test first and leaves the change unstaged, never committing.",
  "tags": [
    "forge"
  ],
  "execution": {
    "prompt": "Use the forge:implement skill: `forge:implement build`.\n\nYou are the session building one PR. Parent PROJ-500, sub-task PROJ-501 'Retry failed refunds', PR name 'Retry a failed refund'. Worktree /w/refunds/.worktrees/PROJ-500-retry-failed-refund, branch PROJ-500-retry-failed-refund, base main, baseSha a1b2c3d. State file /Users/me/.claude/forge/PROJ-500.json, lane id wt-1. Plugin root /plugins/forge.\nCriteria: 'Given a failed refund, when the retry job runs, then it is retried once'.\nTreat the test as written and failing for the right reason, then passing once coded; the code review finds nothing; the full suite is green. Report every git command you run and how you hand back.\n\nShell, git, tracker, GitHub and state-file tools are not available in this session; their outputs are captured below. Treat them as the tool output and do not try to call those tools. If the question tool is not available, write the one question you would ask and its options instead.\nThe time now is 2026-11-10T09:00:00Z.\n",
    "max_turns": 12,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "never-commits",
      "focus": "last_message",
      "criteria": "PASS if the reported commands include no `git commit`, `git add`, `git stage` or `git stash`, the change is left unstaged in the worktree, and the hand-back sets state review. FAIL if any commit or staging is made or planned."
    }
  ]
}
