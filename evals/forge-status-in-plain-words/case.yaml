{
  "schema_version": "1.1",
  "name": "forge-status-in-plain-words",
  "description": "While PRs build and are followed, forge reports them by what they do, with no forge-internal words.",
  "tags": [
    "forge"
  ],
  "execution": {
    "prompt": "/forge PROJ-500\n\nstate file /Users/me/.claude/forge/PROJ-500.json:\n```json\n{\"plan\": {\"parent\": {\"key\": \"PROJ-500\", \"title\": \"Retry failed refunds\", \"type\": \"story\"}, \"trackerUrl\": \"https://example.atlassian.net\", \"done\": [{\"criterion\": \"Failed refunds are retried within an hour\", \"by\": \"forge\", \"source\": \"Datadog\", \"how\": \"monitor refund.retry.lag below 60 minutes\"}, {\"criterion\": \"The refund page shows the retry status\", \"by\": \"you\"}], \"prs\": [{\"pr\": \"S1\\u00b71\", \"name\": \"Retry a failed refund\", \"subTask\": \"PROJ-501\", \"title\": \"Retry failed refunds\", \"repo\": \"/w/refunds\", \"base\": \"main\", \"criteria\": [\"Given a failed refund, when the retry job runs, then it is retried once\"], \"dependsOn\": []}, {\"pr\": \"S2\\u00b71\", \"name\": \"Show the retry status\", \"subTask\": \"PROJ-502\", \"title\": \"Show retry status\", \"repo\": \"/w/refund-page\", \"base\": \"main\", \"criteria\": [\"Given a retried refund, when the page loads, then it shows Retrying\"], \"dependsOn\": []}]}, \"lanes\": [{\"id\": \"wt-1\", \"subTask\": \"PROJ-501\", \"pr\": \"S1\\u00b71\", \"repo\": \"/w/refunds\", \"branch\": \"PROJ-500-retry-failed-refund\", \"base\": \"main\", \"baseSha\": \"a1b2c3d\", \"worktree\": \"/w/refunds/.worktrees/PROJ-500-retry-failed-refund\", \"runner\": {\"kind\": \"session\", \"id\": \"local_1\"}, \"dependsOn\": [], \"state\": \"building\", \"prNumber\": null}, {\"id\": \"wt-2\", \"subTask\": \"PROJ-502\", \"pr\": \"S2\\u00b71\", \"repo\": \"/w/refund-page\", \"branch\": \"PROJ-500-show-retry-status\", \"base\": \"main\", \"baseSha\": \"e4f5\", \"worktree\": \"/w/refund-page/.worktrees/PROJ-500-show-retry-status\", \"runner\": {\"kind\": \"session\", \"id\": \"local_2\"}, \"dependsOn\": [], \"state\": \"ci\", \"prNumber\": 77, \"prUrl\": \"https://github.com/o/refund-page/pull/77\"}]}\n```\nsession list: local_1 running, local_2 running.\n\nShell, git, tracker, GitHub and state-file tools are not available in this session; their outputs are captured below. Treat them as the tool output and do not try to call those tools. If the question tool is not available, write the one question you would ask and its options instead.\nThe time now is 2026-11-10T09:00:00Z.\n",
    "max_turns": 12,
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "env": {}
  },
  "runs": 3,
  "graders": [
    {
      "type": "llm",
      "name": "plain-words",
      "focus": "last_message",
      "criteria": "Check the reply's text only. PASS if both PRs are named by what they do ('Retry a failed refund' and 'Show the retry status'), the second shows its number 77 in any form (for example '#77' or 'refund-page #77'), and none of these strings appear: 'S1\u00b71', 'S2\u00b71', 'wt-1', 'wt-2', 'PROJ-500-retry-failed-refund', 'PROJ-500-show-retry-status', 'local_1', 'local_2', or the words lane, runner, watcher, raise, conductor or registry. A repo name such as 'refunds' or 'refund-page' is allowed. FAIL only if a named PR is missing or one of those strings appears."
    },
    {
      "type": "llm",
      "name": "asks-nothing",
      "focus": "last_message",
      "criteria": "PASS if it asks no question, since nothing waits on the user. FAIL if it asks one."
    }
  ]
}
