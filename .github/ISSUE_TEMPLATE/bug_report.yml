name: Bug report
description: Something broke or behaves wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Remove anything private before you submit: ticket keys, repository names, URLs, code.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: dropdown
    id: step
    attributes:
      label: Step
      options: [Plan, Implement, Deploy, Verify, Clean up, Pane, Chat cards, Other]
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Claude Code, forge, Python and gh.
      placeholder: "claude 2.x, forge 0.12.0, python 3.12, gh 2.x"
  - type: textarea
    id: state
    attributes:
      label: State file
      description: The part of ~/.claude/forge/<ticket>.json that matters, with private values replaced.
      render: json
